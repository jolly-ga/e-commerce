<H2>Checkout</H2>
<form [formGroup]="formulario">
    <p><input type= "text" formControlName="nome" placeholder="Digite seu nome completo"></p>
     <p><input type= "email" formControlName="email" placeholder="Digite seu E-mail"></p>
      <p><input type= "text" formControlName="endereco" placeholder="Digite seu endereço"></p>
      <button type="button" (click)="finalizar()">Finalizar compra</button>
</form>
